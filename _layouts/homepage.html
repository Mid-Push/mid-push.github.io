<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <title>{{ site.title }} | {{ site.position }}</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    {% if site.keywords %}<meta name="keywords" content="{{ site.keywords }}">{% endif %}
    {% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}">{% endif %}

    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}" type="image/png">
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}" type="image/png">
    <script src="./assets/js/favicon-switcher.js" type="application/javascript"></script>
    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme');
        const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css" integrity="sha256-+N4/V/SbAFiW1MPBCXnfnP9QSN3+Keu+NlB+0ev/YKQ=" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/publications.css">
    <link rel="stylesheet" href="./assets/css/custom.css">
    <link rel="stylesheet" href="./assets/css/portfolio.css">
  </head>
  <body class="portfolio-page" id="home">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="site-brand" href="#home" aria-label="Shaoan Xie, home">{{ site.title }}</a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>

        <nav class="site-navigation" id="site-navigation" aria-label="Primary navigation">
          <a class="active" href="#home">Home</a>
          <a href="#featured-research">Research</a>
          <a href="#publications">Publications</a>
          <a href="#research-impact">Projects</a>
          <a href="#about">About</a>
        </nav>

        <button class="theme-toggle" type="button" aria-label="Toggle color theme">
          <i class="far fa-moon" aria-hidden="true"></i>
          <i class="far fa-sun" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="portfolio-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ 'now' | date: "%Y" }} Shaoan Xie</span>
      <a href="#home">Back to top ↑</a>
    </footer>

    <script>
      const themeToggle = document.querySelector('.theme-toggle');
      const navToggle = document.querySelector('.nav-toggle');
      const navigation = document.querySelector('.site-navigation');

      themeToggle.addEventListener('click', function () {
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem('theme', nextTheme);
      });

      navToggle.addEventListener('click', function () {
        const isOpen = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!isOpen));
        navigation.classList.toggle('open', !isOpen);
      });

      navigation.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          navToggle.setAttribute('aria-expanded', 'false');
          navigation.classList.remove('open');
        });
      });
    </script>

    {% if site.ga4_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.ga4_analytics }}');
    </script>
    {% endif %}
  </body>
</html>
